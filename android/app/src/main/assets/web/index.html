<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Miku</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418;
               font-family: -apple-system, "Noto Sans CJK SC", sans-serif; }
  #stage { position: fixed; inset: 0; }

  /* 顶部状态条 */
  #topbar {
    position: fixed; left: 0; right: 0; top: 0; padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #cfe9e6; background: linear-gradient(#000a, #0000);
    z-index: 20; pointer-events: none;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex: none; }
  #dot.on { background: #39c5bb; } #dot.err { background: #ef4444; }
  #engine { opacity: .75; font-size: 11px; }
  /* 模型切换：手机上也能换，和 PC 控制台是同一份选择（PC 广播回来才算数）。 */
  #model {
    position: fixed; top: 8px; right: 72px; z-index: 30;
    font-size: 11px; line-height: 1; padding: 6px 10px; border-radius: 999px;
    border: 1px solid rgba(57,197,187,.45); background: rgba(57,197,187,.16);
    color: #7fe3da; font-family: inherit;
  }

  /* 气泡 */
  #bubble {
    position: fixed; left: 12px; right: 12px; top: 40px; max-height: 34vh;
    background: rgba(255,255,255,.96); border-radius: 14px; padding: 10px 12px;
    color: #1f2430; font-size: 14px; line-height: 1.55;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 6px 20px #0006; z-index: 15; display: none; white-space: pre-wrap;
    word-break: break-word;
  }
  #bubble.show { display: block; }
  #chip { display: inline-block; font-size: 11px; color: #168f86;
          background: rgba(57,197,187,.16); border-radius: 999px;
          padding: 1px 8px; margin-bottom: 4px; }

  /* 水印开关。模型说明第 4 条要求「水印按键默认打开，需在设置表情中关闭」，
     所以这里按默认开、一键可关。 */
  #wm {
    position: fixed; top: 10px; right: 10px; z-index: 30;
    font-size: 11px; line-height: 1; padding: 5px 9px; border-radius: 999px;
    border: 1px solid rgba(57,197,187,.45); background: rgba(57,197,187,.16);
    color: #7fe3da; font-family: inherit; cursor: pointer;
  }
  #wm.off { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #8b929c; }

  /* 长按不要触发文字选中 / 系统上下文菜单。
     踩过的坑：按住麦克风说话时，长按会被 WebView 当成「选中文字」，
     弹出选择手柄并把录音打断。按钮和输入栏整体禁用选择；
     输入框和气泡要保持可选中/可滚动，所以只对 #bar 生效。 */
  #bar, #bar *, #wm, #model, #topbar {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #text { -webkit-user-select: text; user-select: text; }
  #bubble { -webkit-user-select: text; user-select: text; }

  /* 底部输入区 */
  #bar {
    position: fixed; left: 8px; right: 8px; bottom: 8px;
    display: flex; gap: 6px; align-items: center; z-index: 20;
  }
  #text {
    flex: 1; min-width: 0; border: none; border-radius: 22px; padding: 12px 16px;
    font-size: 15px; background: rgba(255,255,255,.95); color: #1f2430; outline: none;
  }
  .btn {
    flex: none; border: none; border-radius: 50%; width: 46px; height: 46px;
    font-size: 20px; background: rgba(255,255,255,.95); color: #1f2430;
    display: flex; align-items: center; justify-content: center;
  }
  .btn.primary { background: #39c5bb; color: #fff; }
  .btn.rec { background: #ef4444; color: #fff; }
  .btn.attach { background: #ffd166; }
  .btn.on { background: #39c5bb; color: #06231f; }
  .btn:disabled { opacity: .45; }

  /* 首次使用：填 PC 地址 */
  #setup {
    position: fixed; inset: 0; background: #101418ee; z-index: 40;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 12px; padding: 28px; color: #cfe9e6;
  }
  #setup.hide { display: none; }
  #setup h2 { margin: 0; font-size: 17px; color: #39c5bb; }
  #setup p { margin: 0; font-size: 13px; line-height: 1.6; opacity: .8; text-align: center; }
  #host { width: 100%; max-width: 320px; border: 1px solid #2b3a42; border-radius: 10px;
          padding: 12px; font-size: 15px; background: #18212a; color: #e8f4f2; outline: none; }
  #setup .go { background: #39c5bb; color: #fff; border: none; border-radius: 10px;
               padding: 12px 32px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <span id="dot"></span><span id="status">初始化…</span>
  <span id="engine" style="margin-left:auto"></span>
</div>

<div id="bubble"><span id="chip"></span><div id="btext"></div></div>

<button id="model" title="切换 Live2D 模型">模型</button>
<button id="wm" title="水印开关（模型默认打开）">水印</button>

<div id="bar">
  <input id="text" placeholder="和 Miku 说点什么…" autocomplete="off">
  <button class="btn" id="video" title="视频对话：说话时自动拍一张给 Miku 看">📹</button>
  <button class="btn" id="cam" title="拍照">📷</button>
  <button class="btn" id="mic" title="按住说话">🎤</button>
  <button class="btn primary" id="send" title="发送">➤</button>
</div>

<div id="setup">
  <h2>连接你的 PC</h2>
  <p>Miku 的大脑跑在 PC 上。请填 PC 的局域网地址<br>
     （PC 端气泡里会显示，形如 <code>192.168.20.102</code>；<br>
     安卓模拟器请填 <code>10.0.2.2</code>）</p>
  <input id="host" inputmode="url" placeholder="192.168.20.102" autocomplete="off">
  <button class="go" id="connect">连接</button>
  <p style="font-size:12px;opacity:.6">端口默认 8765</p>
</div>

<!-- 全部本地加载，零 CDN。顺序不能变：Core 必须在 cubism4 之前。 -->
<script src="lib/pixi.min.js"></script>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/cubism4.min.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const native = window.NativeBridge || null;
// 固定入口：AssetServer 把「当前模型的 model3.json」映射到这个虚拟路径。
// 换模型时页面源码一个字都不用改，重载即可。
const MODEL_URL = "/model/_active.model3.json";
// 当前模型的渲染画像（情绪→表情/倾角、水印参数），由 PC 下发 →
// 原生缓存 → 这里读。见 docs/TECHNICAL.md 与 backend/models_catalog.py。
const PROFILE_URL = "/model/__profile.json";

const EMOTION_CN = {
  HAPPY:"开心", SAD:"难过", ANGRY:"生气", SURPRISED:"惊讶",
  MOTIVATED:"元气", EMPATHY:"温柔", NORMAL:"平静",
};

// 下面三张表在拿到画像之前是空的，由 applyProfile() 填。
// 为什么不写死在页面里：PC 桌面端与手机端用**同一份**画像
// （backend/models_catalog.py），两端行为才不会各走各的
// —— 以前这里硬编码过新模型的表情名，换回经典模型时就会全部失效。
let EMOTION_TILT = {};
let EMOTION_EXPR = {};
/** 水印参数（如 Param137）。为空表示这个模型没有水印，按钮直接藏起来。 */
let WM_PARAM = "";
let WM_HIDDEN_VALUE = 1;
let WM_SHOWN_VALUE = 0;
let watermarkHidden = localStorage.getItem("miku_watermark_hidden") !== "0";
/** 可用模型清单，由 PC 在 ready/config 里下发。 */
let MODELS = [];
let currentModel = "";

function applyProfile(p) {
  if (!p || typeof p !== "object") return;
  EMOTION_TILT = p.emotion_tilt || {};
  EMOTION_EXPR = p.emotion_expression || {};
  if (p.watermark_param) {
    WM_PARAM = p.watermark_param;
    WM_HIDDEN_VALUE = Number(p.watermark_hidden_value ?? 1);
    WM_SHOWN_VALUE = Number(p.watermark_shown_value ?? 0);
  } else {
    // 经典模型没有水印参数 —— 把按钮藏掉，别给用户一个点了没反应的开关
    WM_PARAM = "";
  }
  const btn = $("wm");
  if (btn) btn.style.display = WM_PARAM ? "" : "none";
  console.log("PROFILE tilt=" + JSON.stringify(EMOTION_TILT) +
    " expr=" + JSON.stringify(EMOTION_EXPR) + " wm=" + (WM_PARAM || "none"));
}

let app = null, model = null, core = null;
let pendingImage = null;
let currentExpr = null;

/** 应用表情。传 null 表示清除。 */
function applyExpression(name) {
  if (!model) return;
  try {
    if (name) model.expression(name);   // 必须是**字符串**形式，数组形式实测不生效
    else model.expression();
    currentExpr = name || null;
  } catch (e) {
    console.warn("表情 " + name + " 应用失败: " + e.message);
  }
}

/** 水印开关：直接改参数，立刻生效且不受情绪表情影响。 */
function setWatermark(hidden) {
  watermarkHidden = !!hidden;
  localStorage.setItem("miku_watermark_hidden", watermarkHidden ? "1" : "0");
  const btn = $("wm");
  if (btn) {
    btn.classList.toggle("off", watermarkHidden);
    btn.textContent = watermarkHidden ? "水印 关" : "水印";
  }
}

/** 状态栏上的模型名 + 「点一下换模型」。清单和当前值都由 PC 下发。 */
function renderModelButton() {
  const btn = $("model");
  if (!btn) return;
  const cur = MODELS.find((m) => m.id === currentModel);
  btn.textContent = cur ? ("模型 " + (cur.short || cur.name)) : "";
  btn.style.display = MODELS.length > 1 ? "" : "none";
}

function cycleModel() {
  if (MODELS.length < 2) return;
  const order = MODELS.map((m) => m.id);
  const i = Math.max(0, order.indexOf(currentModel));
  const next = order[(i + 1) % order.length];
  // 只发请求：真正切换等 PC 广播 config 回来，这样 PC 控制台和所有手机一致
  showBubble("正在换成「" + ((MODELS.find((m) => m.id === next) || {}).name || next) + "」…", "NORMAL");
  setStatus("切换模型中…");
  native && native.setModel && native.setModel(next);
}

// 贴图诊断：pixi-live2d-display 不同版本把 textures 挂在 internalModel 上，
// 这里多探几个位置，避免误报成 0。
function texList() {
  if (!model) return [];
  const im = model.internalModel || {};
  return im.textures || im.textureResources || model.textures || [];
}
function texCount() { return texList().length; }
function texSizes() {
  return texList().slice(0, 3).map((t) => {
    if (!t) return "null";
    const b = t.baseTexture || t;
    return (b.width || "?") + "x" + (b.height || "?");
  });
}

function setStatus(text, cls) {
  $("status").textContent = text;
  const dot = $("dot");
  dot.className = cls === "err" ? "err" : (cls === "on" ? "on" : "");
}
function showBubble(text, emotion) {
  $("chip").textContent = (EMOTION_CN[emotion] || "平静");
  $("btext").textContent = text;
  const b = $("bubble");
  b.classList.add("show");
  b.scrollTop = 0;      // 新消息从第一句开始读
  layout();             // 气泡高度变了，模型要让位（否则长回复会挡住头）
}
function hideBubble() {
  $("bubble").classList.remove("show");
  layout();
}

/** 气泡当前占用的底部位置（没显示时为 0），给 layout() 当上方留白用。 */
function bubbleBottom() {
  const b = $("bubble");
  if (!b || !b.classList.contains("show")) return 0;
  return b.getBoundingClientRect().bottom;
}

// ---------------------------------------------------------------- Live2D
/** 取当前模型的渲染画像（情绪映射 / 水印参数）。拿不到就用空表，页面照常渲染。 */
async function loadProfile() {
  try {
    const r = await fetch(PROFILE_URL, { cache: "no-store" });
    if (r.ok) applyProfile(await r.json());
    else console.warn("画像返回 " + r.status);
  } catch (e) {
    console.warn("取画像失败: " + e.message);
  }
}

async function loadModel() {
  if (model) return;
  try {
    if (!window.PIXI) throw new Error("pixi.min.js 未加载");
    if (!window.Live2DCubismCore) throw new Error("Cubism Core 未加载");
    if (!PIXI.live2d) throw new Error("cubism4.min.js 未加载");

    await loadProfile();

    const v = Live2DCubismCore.Version.csmGetVersion();
    setStatus("加载模型… (Core " + (v>>>24) + "." + ((v>>>16)&255) + ")");

    app = app || new PIXI.Application({
      backgroundAlpha: 0, antialias: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
      autoDensity: true, resizeTo: window, powerPreference: "high-performance",
    });
    if (!app.view.parentNode) $("stage").appendChild(app.view);

    app.view.addEventListener("webglcontextlost", (e) => {
      e.preventDefault();
      reportFail("WebGL 上下文丢失（大概率是显存不足）");
    });

    const t0 = performance.now();
    model = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
    const ms = Math.round(performance.now() - t0);
    app.stage.addChild(model);
    core = model.internalModel.coreModel;

    layout();
    window.addEventListener("resize", layout);
    setStatus("已就绪", "on");

    // 水印：默认隐藏（用户明确要求去掉）。模型说明第 4 条是「默认打开、
    // 可在表情设置里关闭」—— 这里保留了开关，想恢复显示点右上角即可。
    // 没有水印参数的模型（经典模型）applyProfile 已经把按钮藏掉了。
    if (WM_PARAM) setWatermark(watermarkHidden);

    // 恢复上次的视频对话开关状态（默认关，和 PC 的默认一致）
    applyVideoMode();

    // 挂参数写入器（口型 / 情绪倾角）—— 必须在模型加载后
    bindParamWriter();

    model.on("pointertap", () => {
      try { model.motion(["Idle","Tap","Flick","FlickUp","Dance"][Math.floor(Math.random()*5)]); }
      catch (e) { /* 该模型 motion3 只有一条，失败不影响渲染 */ }
    });

    const info = JSON.stringify({
      core: (v>>>24)+"."+((v>>>16)&255)+"."+((v>>>8)&255), pixi: PIXI.VERSION,
      loadMs: ms, canvas: [model.internalModel.width, model.internalModel.height],
      parts: core.getPartCount(), params: core.getParameterCount(),
      drawables: core.getDrawableCount(),
      // 贴图排查用：数量 + 前两张的尺寸。textures 为 0 或尺寸异常都说明
      // 贴图没真正加载进来（模型会「加载成功」但画出来是全透明）。
      textures: texCount(),
      texSizes: texSizes(),
      bounds: [Math.round(model.x), Math.round(model.y),
               Math.round(model.width), Math.round(model.height)],
      scale: Number(model.scale.x.toFixed(4)),
      stage: [app.renderer.width, app.renderer.height],
      screen: [window.innerWidth, window.innerHeight],
    });
    console.log("RENDER OK " + info);
    native && native.ready && native.ready(info);
  } catch (e) {
    reportFail("模型加载失败: " + (e && e.message ? e.message : e));
  }
}

function reportFail(msg) {
  setStatus("❌ " + msg, "err");
  console.error(msg);
  native && native.failed && native.failed(msg);
}

// ------------------------------------------------------- 取景（实测渲染像素）
//
// 为什么不用 getDrawableVertices() 量：那个只给**几何**范围，不管那块几何
// 到底有没有被画出来。经典模型实测就踩到 —— 顶点算出来的美术框顶部有
// 1600 多画布像素是空的，于是模型被判定为「很高」，缩放系数算小一半，
// 人整个缩到屏幕下半部分（真机截图确认：y 38~363 这一段一个像素都没有）。
//
// 所以两边（PC 原生 / 手机 WebGL）统一成同一套办法：**画一帧、读回来、
// 按 alpha 求包围盒**。这样量到的就是屏幕上真实存在的东西。
//
// 坐标关系（pixi-live2d-display）：屏幕 = model.position + 本地坐标 * model.scale，
// 是严格线性的，所以只要在某个已知 scale 上量一次，就能反推出本地美术范围。

function touchesEdge(box, w, h, slack) {
  return box.minX <= slack || box.minY <= slack ||
         box.maxX >= w - slack || box.maxY >= h - slack;
}

/**
 * 美术在**模型本地坐标**里的范围，只量一次。
 * 本地范围是模型固有属性（与窗口大小无关），所以能安全缓存。
 */
let artLocal = null;

/** 直接读 WebGL 帧缓冲的 alpha，返回美术包围盒（CSS 像素，原点左上）。 */
function measureRenderedBox() {
  const gl = app.renderer.gl;
  const W = app.renderer.width, H = app.renderer.height;
  const res = app.renderer.resolution;
  app.renderer.render(app.stage);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const buf = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);

  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let y = 0; y < H; y++) {
    // GL 原点在左下：行号要翻过来
    const base = (H - 1 - y) * W * 4;
    for (let x = 0; x < W; x++) {
      if (buf[base + x * 4 + 3] > 8) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < minX || maxY < minY) return null;
  return { minX: minX / res, minY: minY / res, maxX: maxX / res, maxY: maxY / res };
}

/** 兜底：渲染测量失败时退回顶点法（会偏，但总比不摆强）。 */
function measureArtBoundsByVertices() {
  const cw = model.internalModel.width;
  const ch = model.internalModel.height;
  const unitsW = core.getCanvasWidth();
  if (!(unitsW > 0)) return null;
  const ppu = cw / unitsW;
  const ox = cw / 2, oy = ch / 2;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const n = core.getDrawableCount();
  for (let i = 0; i < n; i++) {
    let v;
    try { v = core.getDrawableVertices(i); } catch (e) { continue; }
    if (!v || !v.length) continue;
    for (let k = 0; k < v.length; k += 2) {
      const x = ox + v[k] * ppu, y = oy + v[k + 1] * ppu;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  if (!isFinite(minX) || maxX <= minX) return null;
  return { minX, minY, maxX, maxY, local: true };
}

function availRect() {
  const w = app.renderer.width / app.renderer.resolution;
  const h = app.renderer.height / app.renderer.resolution;
  // topPad 要跟着**气泡的实际高度**走 —— 长回复时气泡能占到 34vh，
  // 固定值会让模型被压在气泡底下（用户报过「回复太长会挡住头部」）。
  const padX = 10;
  return {
    x0: padX, x1: w - padX,
    y0: Math.max(38, bubbleBottom() + 8),
    y1: h - 86,
  };
}

function applyLayout(s, artCx, artCy, avail) {
  model.scale.set(s);
  model.position.set(
    (avail.x0 + avail.x1) / 2 - artCx * s,
    (avail.y0 + avail.y1) / 2 - artCy * s,
  );
}

function layout() {
  if (!model || !app) return;
  const avail = availRect();
  const availW = Math.max(1, avail.x1 - avail.x0);
  const availH = Math.max(1, avail.y1 - avail.y0);
  const w = app.renderer.width / app.renderer.resolution;
  const h = app.renderer.height / app.renderer.resolution;

  // 动画会让包围盒抖动，量之前先停掉动作；量完 ticker 会自己把待机接回去
  let mm = model.internalModel && model.internalModel.motionManager;
  try { mm && mm.stopAllMotions && mm.stopAllMotions(); } catch (e) {}

  let s, artCx, artCy, artW, artH, method = "rendered";

  if (artLocal) {
    // 已经量过一次了：本地美术范围是模型的固有属性，不用再量一遍。
    // 这一步很值钱 —— 每次读 720x1600 的帧缓冲大约十几毫秒，
    // 而 layout() 在气泡出现/消失、窗口旋转时都会被调用。
    ({ w: artW, h: artH, cx: artCx, cy: artCy } = artLocal);
    method = "cached";
  } else {
    // 1) 缩到很小、摆到原点，量出美术在**本地坐标**里的真实范围
    let k = 0.05, box = null;
    for (let i = 0; i < 6; i++) {
      model.scale.set(k);
      model.position.set(0, 0);
      box = measureRenderedBox();
      if (box && !touchesEdge(box, w, h, 1.5)) break;
      box = null;
      k *= 0.5;
      console.log("首次测量贴边，缩到 k=" + k);
    }

    if (box) {
      artW = (box.maxX - box.minX) / k;
      artH = (box.maxY - box.minY) / k;
      artCx = (box.minX + box.maxX) / 2 / k;
      artCy = (box.minY + box.maxY) / 2 / k;
    } else {
      const fb = measureArtBoundsByVertices();
      if (!fb) { console.warn("取景失败：渲染测量与顶点测量都没拿到包围盒"); return; }
      method = "vertices(fallback)";
      artW = fb.maxX - fb.minX;
      artH = fb.maxY - fb.minY;
      artCx = (fb.minX + fb.maxX) / 2;
      artCy = (fb.minY + fb.maxY) / 2;
    }
    artLocal = { w: artW, h: artH, cx: artCx, cy: artCy };
  }

  // 2) 按可用区算目标缩放，并让美术中心落在可用区中心
  s = Math.min(availW / artW, availH / artH);
  applyLayout(s, artCx, artCy, avail);

  // 3) 复测一次做闭环校正：变换是线性的，一轮就够收敛
  const after = measureRenderedBox();
  if (after) {
    const gotW = after.maxX - after.minX, gotH = after.maxY - after.minY;
    const k2 = Math.min(availW / Math.max(1, gotW), availH / Math.max(1, gotH));
    if (k2 > 0.9 && k2 < 1.1) s *= k2;
    const cx = (after.minX + after.maxX) / 2, cy = (after.minY + after.maxY) / 2;
    applyLayout(
      s,
      artCx + ((avail.x0 + avail.x1) / 2 - cx) / s,
      artCy + ((avail.y0 + avail.y1) / 2 - cy) / s,
      avail,
    );
  }

  const last = measureRenderedBox();
  console.log("FIT(" + method + ") s=" + s.toFixed(4) +
    " artLocal=" + Math.round(artW) + "x" + Math.round(artH) +
    " avail=" + Math.round(availW) + "x" + Math.round(availH) +
    " 实测=" + (last ? (Math.round(last.maxX - last.minX) + "x" + Math.round(last.maxY - last.minY) +
      " @(" + Math.round(last.minX) + "," + Math.round(last.minY) + ")") : "?") +
    " screen=" + Math.round(w) + "x" + Math.round(h));
}

/** 直接写参数，找不到就静默跳过（不同模型参数名可能不同）。 */
function setParam(id, value) {
  if (!core) return;
  try {
    if (typeof core.setParameterValueById === "function") core.setParameterValueById(id, value);
    else if (typeof core.setParameterValue === "function") {
      const idx = core.getParameterIndex(id);
      if (idx >= 0) core.setParameterValue(idx, value, 1);
    }
  } catch (e) { /* 参数不存在时忽略 */ }
}

let tiltTarget = 0, tiltNow = 0, mouthNow = 0;
window.__mouth = 0;

/**
 * 参数必须在 **beforeModelUpdate** 里写，不能放在 requestAnimationFrame 里。
 *
 * 踩过的坑：原先用 rAF 循环写 ParamMouthOpenY，实测该参数**恒为 0**
 * （860 次采样全零）—— 因为 Live2D 的 internalModel.update() 每帧会重算参数，
 * 把 rAF 里写的值覆盖掉。挂在 beforeModelUpdate 上的时机正好是
 * 「动作更新之后、coreModel.update() 算顶点之前」，写了才会真正生效。
 *
 * 事件名是运行时探测出来的（拦截 emit 记录），不是照文档猜的。
 */
function bindParamWriter() {
  if (!model || !model.internalModel || typeof model.internalModel.on !== "function") {
    console.warn("internalModel 不支持事件钩子，口型无法驱动");
    return;
  }
  model.internalModel.on("beforeModelUpdate", () => {
    // 水印：参数名与取值都由画像给（Param137=1 隐藏、0 显示）。
    // 放这里驱动，就不受情绪表情切换影响。
    if (WM_PARAM) setParam(WM_PARAM, watermarkHidden ? WM_HIDDEN_VALUE : WM_SHOWN_VALUE);
    // 口型：原生侧按**真实播放进度**（AudioTrack.playbackHeadPosition）算好的 RMS 包络。
    // 上升快、下降慢，观感更像说话而不是抽搐。
    mouthNow += (mouthNow < window.__mouth ? 0.55 : 0.25) * (window.__mouth - mouthNow);
    setParam("ParamMouthOpenY", mouthNow);
    // 头部微倾，表情绪
    tiltNow += (tiltTarget - tiltNow) * 0.12;
    setParam("ParamAngleZ", tiltNow);
    setParam("ParamBodyAngleZ", tiltNow * 0.35);
  });
  console.log("参数写入器已挂到 beforeModelUpdate");
}

// ---------------------------------------------------- 暴露给原生的 API
window.Miku = {
  loadModel,
  onMouth(level) { window.__mouth = Math.max(0, Math.min(1, level || 0)); },
  onReply(text, emotion) {
    tiltTarget = EMOTION_TILT[emotion] || 0;
    applyExpression(EMOTION_EXPR[emotion] || null);
    showBubble(text, emotion);
    // 回复到了就回到就绪。原先这里不设状态，于是「转写中…」会一直挂着 ——
    // 界面看起来像卡死，其实一切正常（真机上被用户当成 bug 报过来）。
    setStatus("已就绪", "on");
    try { model && model.motion("Idle"); } catch (e) {}
  },
  onTranscript(text) {
    if (text) {
      $("text").value = text;
      showBubble(text, "NORMAL");
      // 后面服务端还会跑一轮 LLM，状态得跟着走，不能停在「转写中」
      setStatus("思考中…");
    } else {
      // 转写为空（没听清 / 麦克风没收到声音）时必须有反馈，
      // 否则界面会一直停在「转写中…」，用户以为卡死了。
      setStatus("已就绪", "on");
      showBubble("唔…没听清，再说一次好不好？", "SAD");
    }
  },
  onSpeech(seconds) {
    if (seconds > 0) setStatus("说话中…");
  },
  // 语音播完由原生回调。没有这个回调的话状态会永远停在「说话中…」。
  onSpeechEnd() { setStatus("已就绪", "on"); },
  onProvider(json) {
    try {
      const p = JSON.parse(json);
      $("engine").textContent = (p.llm||"?") + " · TTS:" + (p.tts||"?") + " · STT:" + (p.stt||"?");
    } catch (e) {}
  },
  /** PC 下发可用模型清单 + 当前选中的那个。 */
  onModels(json, current) {
    try {
      const list = JSON.parse(json);
      if (Array.isArray(list) && list.length) MODELS = list.filter((m) => m.present !== false);
      if (current) currentModel = current;
      renderModelButton();
    } catch (e) { console.warn("模型清单解析失败: " + e.message); }
  },
  onStatus(state, detail) {
    const map = { connected:"已连接", connecting:"连接中…", disconnected:"已断开，重连中…",
                  failed:"连不上 PC", syncing:"", model_ready:"模型就绪", retry:"" };
    if (state === "syncing") { setStatus(detail || "同步模型…"); return; }
    if (state === "retry") { setStatus(detail || "重试中…", "err"); return; }
    if (state === "model_ready") return;
    setStatus(map[state] || state, state === "failed" ? "err" : (state === "connected" ? "on" : ""));
    if (state === "connected") $("setup").classList.add("hide");
  },
  onError(msg) {
    // 出错也要把状态复位，否则会停在「转写中…／思考中…」装作还在忙
    setStatus("已就绪", "on");
    showBubble("呜…" + msg, "SAD");
  },
};

// ---------------------------------------------------------------- 交互
function doSend() {
  const t = $("text").value.trim();
  if (!t && !pendingImage) return;
  if (pendingImage) native.chatWithImage(t, pendingImage);
  else native.chat(t);
  $("text").value = "";
  pendingImage = null;
  $("cam").classList.remove("attach");
}
$("send").onclick = doSend;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") doSend(); });

// 按住说话。
//
// 两个真机踩到的坑：
//  1. 长按会被 WebView 当成「选中文字」，弹出选择手柄并打断录音。
//     除了 CSS 禁选，还要吃掉 contextmenu 事件。
//  2. 原先用 pointerleave 结束录音 —— 手指稍微滑出按钮就停了。
//     改成 setPointerCapture 把指针锁在这个按钮上，只有真正抬手
//     （pointerup/pointercancel）才结束。
let recording = false;
function startRec() {
  const err = native.startRecording();
  if (err) { showBubble("呜…" + err, "SAD"); return; }
  recording = true;
  $("mic").classList.add("rec");
  setStatus("录音中…松开结束");
}
function stopRec() {
  if (!recording) return;
  recording = false;
  $("mic").classList.remove("rec");
  setStatus("转写中…");
  native.stopRecording();
}
$("mic").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { $("mic").setPointerCapture(e.pointerId); } catch (_) {}
  startRec();
});
["pointerup", "pointercancel"].forEach(ev =>
  $("mic").addEventListener(ev, (e) => { e.preventDefault(); stopRec(); }));

// 长按弹菜单 / 选中，一律吃掉
document.addEventListener("contextmenu", (e) => e.preventDefault());
$("bar").addEventListener("selectstart", (e) => e.preventDefault());
$("mic").addEventListener("selectstart", (e) => e.preventDefault());

// 拍照：相机在原生侧（浏览器里 http 拿不到 getUserMedia，原生没这个限制）。
// 这里只负责按一下，原生拍好后通过 Miku.onPhoto(base64) 回传。
$("cam").onclick = () => {
  const err = native.takePhoto();
  if (err) { showBubble("呜…" + err, "SAD"); return; }
  setStatus("拍照中…");
};

window.Miku.onPhoto = (b64) => {
  pendingImage = b64;
  $("cam").classList.add("attach");
  setStatus("已就绪", "on");
  showBubble("拍好啦～发送时会一起给 Miku 看", "NORMAL");
};

// 视频对话开关。和 PC 同一套做法：**不推流**，只在说完一句话时自动附一张画面。
// 好处是摄像头不会一直开着（指示灯常亮是隐私问题），也不费流量。
let videoMode = localStorage.getItem("miku_video_mode") === "1";
function applyVideoMode() {
  const b = $("video");
  if (b) b.classList.toggle("on", videoMode);
  native.setVideoMode && native.setVideoMode(videoMode);
}
$("video").onclick = () => {
  videoMode = !videoMode;
  localStorage.setItem("miku_video_mode", videoMode ? "1" : "0");
  applyVideoMode();
  showBubble(videoMode ? "视频对话打开啦～以后你说话时我会顺便看一眼☆" : "视频对话关掉了哦", "NORMAL");
};

// 水印开关。Param137=1 是隐藏，默认隐藏；想显示回来点一下。
$("wm").onclick = () => {
  if (!WM_PARAM) return;
  setWatermark(!watermarkHidden);
  showBubble(watermarkHidden ? "水印关掉了哦" : "水印开回来啦～", "NORMAL");
};

// 模型切换（手机端入口；PC 控制台上也能改同一个选择）
$("model").onclick = cycleModel;
renderModelButton();

$("connect").onclick = () => {
  const h = $("host").value.trim();
  if (!h) return;
  // 交给原生发起连接（页面自己不碰网络，避免 mixed-content 限制）
  native && native.connect && native.connect(h);
  $("setup").classList.add("hide");
  setStatus("连接中…");
};

// 未捕获错误都要能被 adb logcat 看到
window.addEventListener("error", (e) => reportFail(e.message));
window.addEventListener("unhandledrejection", (e) =>
  reportFail("Promise: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

try {
  console.log("页面脚本就绪");
  // 告诉原生「JS 起来了」——与「模型渲染成功」是两件事。
  // 原生收到后才会下发 loadModel()，所以这一步不能等到模型加载完再调。
  native && native.pageAlive && native.pageAlive();
} catch (e) { reportFail(e.message); }
</script>
</body>
