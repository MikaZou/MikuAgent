<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Miku</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418;
               font-family: -apple-system, "Noto Sans CJK SC", sans-serif; }
  #stage { position: fixed; inset: 0; }

  /* 顶部状态条 */
  #topbar {
    position: fixed; left: 0; right: 0; top: 0; padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #cfe9e6; background: linear-gradient(#000a, #0000);
    z-index: 20; pointer-events: none;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex: none; }
  #dot.on { background: #39c5bb; } #dot.err { background: #ef4444; }
  #engine { opacity: .75; margin-left: auto; font-size: 11px; }

  /* 气泡 */
  #bubble {
    position: fixed; left: 12px; right: 12px; top: 40px; max-height: 34vh;
    background: rgba(255,255,255,.96); border-radius: 14px; padding: 10px 12px;
    color: #1f2430; font-size: 14px; line-height: 1.55;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 6px 20px #0006; z-index: 15; display: none; white-space: pre-wrap;
    word-break: break-word;
  }
  #bubble.show { display: block; }
  #chip { display: inline-block; font-size: 11px; color: #168f86;
          background: rgba(57,197,187,.16); border-radius: 999px;
          padding: 1px 8px; margin-bottom: 4px; }

  /* 底部输入区 */
  #bar {
    position: fixed; left: 8px; right: 8px; bottom: 8px;
    display: flex; gap: 6px; align-items: center; z-index: 20;
  }
  #text {
    flex: 1; min-width: 0; border: none; border-radius: 22px; padding: 12px 16px;
    font-size: 15px; background: rgba(255,255,255,.95); color: #1f2430; outline: none;
  }
  .btn {
    flex: none; border: none; border-radius: 50%; width: 46px; height: 46px;
    font-size: 20px; background: rgba(255,255,255,.95); color: #1f2430;
    display: flex; align-items: center; justify-content: center;
  }
  .btn.primary { background: #39c5bb; color: #fff; }
  .btn.rec { background: #ef4444; color: #fff; }
  .btn.attach { background: #ffd166; }
  .btn:disabled { opacity: .45; }

  /* 首次使用：填 PC 地址 */
  #setup {
    position: fixed; inset: 0; background: #101418ee; z-index: 40;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 12px; padding: 28px; color: #cfe9e6;
  }
  #setup.hide { display: none; }
  #setup h2 { margin: 0; font-size: 17px; color: #39c5bb; }
  #setup p { margin: 0; font-size: 13px; line-height: 1.6; opacity: .8; text-align: center; }
  #host { width: 100%; max-width: 320px; border: 1px solid #2b3a42; border-radius: 10px;
          padding: 12px; font-size: 15px; background: #18212a; color: #e8f4f2; outline: none; }
  #setup .go { background: #39c5bb; color: #fff; border: none; border-radius: 10px;
               padding: 12px 32px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <span id="dot"></span><span id="status">初始化…</span>
  <span id="engine"></span>
</div>

<div id="bubble"><span id="chip"></span><div id="btext"></div></div>

<div id="bar">
  <input id="text" placeholder="和 Miku 说点什么…" autocomplete="off">
  <button class="btn" id="cam" title="拍照">📷</button>
  <button class="btn" id="mic" title="按住说话">🎤</button>
  <button class="btn primary" id="send" title="发送">➤</button>
</div>

<div id="setup">
  <h2>连接你的 PC</h2>
  <p>Miku 的大脑跑在 PC 上。请填 PC 的局域网地址<br>
     （PC 端气泡里会显示，形如 <code>192.168.20.102</code>；<br>
     安卓模拟器请填 <code>10.0.2.2</code>）</p>
  <input id="host" inputmode="url" placeholder="192.168.20.102" autocomplete="off">
  <button class="go" id="connect">连接</button>
  <p style="font-size:12px;opacity:.6">端口默认 8765</p>
</div>

<!-- 全部本地加载，零 CDN。顺序不能变：Core 必须在 cubism4 之前。 -->
<script src="lib/pixi.min.js"></script>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/cubism4.min.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const native = window.NativeBridge || null;
const MODEL_URL = "/model/miku.model3.json";

const EMOTION_CN = {
  HAPPY:"开心", SAD:"难过", ANGRY:"生气", SURPRISED:"惊讶",
  MOTIVATED:"元气", EMPATHY:"温柔", NORMAL:"平静",
};
// 情绪 → 头部倾角（度）。表情要等 model3.json 补全后才能用，倾角是兜底保证「有反应」。
const EMOTION_TILT = {
  HAPPY:-6, SAD:8, ANGRY:5, SURPRISED:-9, MOTIVATED:-4, EMPATHY:7, NORMAL:0,
};
// 情绪 → 该模型自带的表情名。
// 这些名字来自模型自带的 miku.vtube.json 热键表（原生侧在内存里补进 model3.json）：
// 圈圈 / 脸红 / 前倾 / 葱 / 唱歌 / 比心 / QQ人 / 水印
const EMOTION_EXPR = {
  HAPPY: "比心", SURPRISED: "圈圈", MOTIVATED: "唱歌",
  EMPATHY: "脸红", ANGRY: "前倾", SAD: null, NORMAL: null,
};
// 模型说明第 4 条要求「水印按键默认打开」，所以加载后先应用水印。
const DEFAULT_EXPRESSIONS = ["水印"];

let app = null, model = null, core = null;
let pendingImage = null;
let currentExpr = null;

/** 应用表情；传 null 表示清除（保留水印）。 */
function applyExpression(name) {
  if (!model) return;
  try {
    if (currentExpr && currentExpr !== name) model.expression(currentExpr);
    if (name) { model.expression(name); currentExpr = name; }
    else currentExpr = null;
  } catch (e) {
    console.warn("表情 " + name + " 应用失败: " + e.message);
  }
}

// 贴图诊断：pixi-live2d-display 不同版本把 textures 挂在 internalModel 上，
// 这里多探几个位置，避免误报成 0。
function texList() {
  if (!model) return [];
  const im = model.internalModel || {};
  return im.textures || im.textureResources || model.textures || [];
}
function texCount() { return texList().length; }
function texSizes() {
  return texList().slice(0, 3).map((t) => {
    if (!t) return "null";
    const b = t.baseTexture || t;
    return (b.width || "?") + "x" + (b.height || "?");
  });
}

function setStatus(text, cls) {
  $("status").textContent = text;
  const dot = $("dot");
  dot.className = cls === "err" ? "err" : (cls === "on" ? "on" : "");
}
function showBubble(text, emotion) {
  $("chip").textContent = (EMOTION_CN[emotion] || "平静");
  $("btext").textContent = text;
  const b = $("bubble");
  b.classList.add("show");
  b.scrollTop = 0;      // 新消息从第一句开始读
}
function hideBubble() { $("bubble").classList.remove("show"); }

// ---------------------------------------------------------------- Live2D
async function loadModel() {
  if (model) return;
  try {
    if (!window.PIXI) throw new Error("pixi.min.js 未加载");
    if (!window.Live2DCubismCore) throw new Error("Cubism Core 未加载");
    if (!PIXI.live2d) throw new Error("cubism4.min.js 未加载");

    const v = Live2DCubismCore.Version.csmGetVersion();
    setStatus("加载模型… (Core " + (v>>>24) + "." + ((v>>>16)&255) + ")");

    app = app || new PIXI.Application({
      backgroundAlpha: 0, antialias: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
      autoDensity: true, resizeTo: window, powerPreference: "high-performance",
    });
    if (!app.view.parentNode) $("stage").appendChild(app.view);

    app.view.addEventListener("webglcontextlost", (e) => {
      e.preventDefault();
      reportFail("WebGL 上下文丢失（大概率是显存不足）");
    });

    const t0 = performance.now();
    model = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
    const ms = Math.round(performance.now() - t0);
    app.stage.addChild(model);
    core = model.internalModel.coreModel;

    layout();
    window.addEventListener("resize", layout);
    setStatus("已就绪", "on");

    // 模型要求水印默认打开
    DEFAULT_EXPRESSIONS.forEach((n) => applyExpression(n));

    // 挂参数写入器（口型 / 情绪倾角）—— 必须在模型加载后
    bindParamWriter();

    model.on("pointertap", () => {
      try { model.motion(["Idle","Tap","Flick","FlickUp","Dance"][Math.floor(Math.random()*5)]); }
      catch (e) { /* 该模型 motion3 只有一条，失败不影响渲染 */ }
    });

    const info = JSON.stringify({
      core: (v>>>24)+"."+((v>>>16)&255)+"."+((v>>>8)&255), pixi: PIXI.VERSION,
      loadMs: ms, canvas: [model.internalModel.width, model.internalModel.height],
      parts: core.getPartCount(), params: core.getParameterCount(),
      drawables: core.getDrawableCount(),
      // 贴图排查用：数量 + 前两张的尺寸。textures 为 0 或尺寸异常都说明
      // 贴图没真正加载进来（模型会「加载成功」但画出来是全透明）。
      textures: texCount(),
      texSizes: texSizes(),
      bounds: [Math.round(model.x), Math.round(model.y),
               Math.round(model.width), Math.round(model.height)],
      scale: Number(model.scale.x.toFixed(4)),
      stage: [app.renderer.width, app.renderer.height],
      screen: [window.innerWidth, window.innerHeight],
    });
    console.log("RENDER OK " + info);
    native && native.ready && native.ready(info);
  } catch (e) {
    reportFail("模型加载失败: " + (e && e.message ? e.message : e));
  }
}

function reportFail(msg) {
  setStatus("❌ " + msg, "err");
  console.error(msg);
  native && native.failed && native.failed(msg);
}

// 模型的本地包围盒，只算一次。用它来定位，就不必猜 anchor / 原点的语义 ——
// 我在这上面猜错过两次：加 anchor 只看到下半身，去掉 anchor 又跑到屏幕右边。
let modelBounds = null;

function layout() {
  if (!model || !app) return;
  const w = app.renderer.width / app.renderer.resolution;
  const h = app.renderer.height / app.renderer.resolution;

  if (!modelBounds) {
    // 先在"单位变换"下量一次真实包围盒
    model.scale.set(1);
    model.position.set(0, 0);
    const b = model.getLocalBounds();
    modelBounds = { x: b.x, y: b.y, width: b.width, height: b.height };
    console.log("LOCAL_BOUNDS " + JSON.stringify(modelBounds));
  }
  if (!(modelBounds.width > 0) || !(modelBounds.height > 0)) return;

  const s = Math.min(w / modelBounds.width, h / modelBounds.height);
  model.scale.set(s);
  // 把包围盒的**中心**对齐到屏幕中心
  model.position.set(
    w / 2 - (modelBounds.x + modelBounds.width / 2) * s,
    h / 2 - (modelBounds.y + modelBounds.height / 2) * s,
  );
  console.log("LAYOUT s=" + s.toFixed(4) +
              " pos=" + Math.round(model.position.x) + "," + Math.round(model.position.y) +
              " screen=" + Math.round(w) + "x" + Math.round(h));
}

/** 直接写参数，找不到就静默跳过（不同模型参数名可能不同）。 */
function setParam(id, value) {
  if (!core) return;
  try {
    if (typeof core.setParameterValueById === "function") core.setParameterValueById(id, value);
    else if (typeof core.setParameterValue === "function") {
      const idx = core.getParameterIndex(id);
      if (idx >= 0) core.setParameterValue(idx, value, 1);
    }
  } catch (e) { /* 参数不存在时忽略 */ }
}

let tiltTarget = 0, tiltNow = 0, mouthNow = 0;
window.__mouth = 0;

/**
 * 参数必须在 **beforeModelUpdate** 里写，不能放在 requestAnimationFrame 里。
 *
 * 踩过的坑：原先用 rAF 循环写 ParamMouthOpenY，实测该参数**恒为 0**
 * （860 次采样全零）—— 因为 Live2D 的 internalModel.update() 每帧会重算参数，
 * 把 rAF 里写的值覆盖掉。挂在 beforeModelUpdate 上的时机正好是
 * 「动作更新之后、coreModel.update() 算顶点之前」，写了才会真正生效。
 *
 * 事件名是运行时探测出来的（拦截 emit 记录），不是照文档猜的。
 */
function bindParamWriter() {
  if (!model || !model.internalModel || typeof model.internalModel.on !== "function") {
    console.warn("internalModel 不支持事件钩子，口型无法驱动");
    return;
  }
  model.internalModel.on("beforeModelUpdate", () => {
    // 口型：原生侧按**真实播放进度**（AudioTrack.playbackHeadPosition）算好的 RMS 包络。
    // 上升快、下降慢，观感更像说话而不是抽搐。
    mouthNow += (mouthNow < window.__mouth ? 0.55 : 0.25) * (window.__mouth - mouthNow);
    setParam("ParamMouthOpenY", mouthNow);
    // 头部微倾，表情绪
    tiltNow += (tiltTarget - tiltNow) * 0.12;
    setParam("ParamAngleZ", tiltNow);
    setParam("ParamBodyAngleZ", tiltNow * 0.35);
  });
  console.log("参数写入器已挂到 beforeModelUpdate");
}

// ---------------------------------------------------- 暴露给原生的 API
window.Miku = {
  loadModel,
  onMouth(level) { window.__mouth = Math.max(0, Math.min(1, level || 0)); },
  onReply(text, emotion) {
    tiltTarget = EMOTION_TILT[emotion] || 0;
    applyExpression(EMOTION_EXPR[emotion] || null);
    showBubble(text, emotion);
    try { model && model.motion("Idle"); } catch (e) {}
  },
  onTranscript(text) { if (text) { $("text").value = text; showBubble(text, "NORMAL"); } },
  onSpeech(seconds) { console.log("speech " + seconds + "s"); },
  onProvider(json) {
    try {
      const p = JSON.parse(json);
      $("engine").textContent = (p.llm||"?") + " · TTS:" + (p.tts||"?") + " · STT:" + (p.stt||"?");
    } catch (e) {}
  },
  onStatus(state, detail) {
    const map = { connected:"已连接", connecting:"连接中…", disconnected:"已断开，重连中…",
                  failed:"连不上 PC", syncing:"", model_ready:"模型就绪", retry:"" };
    if (state === "syncing") { setStatus(detail || "同步模型…"); return; }
    if (state === "retry") { setStatus(detail || "重试中…", "err"); return; }
    if (state === "model_ready") return;
    setStatus(map[state] || state, state === "failed" ? "err" : (state === "connected" ? "on" : ""));
    if (state === "connected") $("setup").classList.add("hide");
  },
  onError(msg) { showBubble("呜…" + msg, "SAD"); },
};

// ---------------------------------------------------------------- 交互
function doSend() {
  const t = $("text").value.trim();
  if (!t && !pendingImage) return;
  if (pendingImage) native.chatWithImage(t, pendingImage);
  else native.chat(t);
  $("text").value = "";
  pendingImage = null;
  $("cam").classList.remove("attach");
}
$("send").onclick = doSend;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") doSend(); });

// 按住说话
let recording = false;
function startRec() {
  const err = native.startRecording();
  if (err) { showBubble("呜…" + err, "SAD"); return; }
  recording = true;
  $("mic").classList.add("rec");
  setStatus("录音中…松开结束");
}
function stopRec() {
  if (!recording) return;
  recording = false;
  $("mic").classList.remove("rec");
  setStatus("转写中…");
  native.stopRecording();
}
["pointerdown"].forEach(ev => $("mic").addEventListener(ev, (e) => { e.preventDefault(); startRec(); }));
["pointerup","pointercancel","pointerleave"].forEach(ev =>
  $("mic").addEventListener(ev, (e) => { e.preventDefault(); stopRec(); }));

// 拍照：相机在原生侧（浏览器里 http 拿不到 getUserMedia，原生没这个限制）。
// 这里只负责按一下，原生拍好后通过 Miku.onPhoto(base64) 回传。
$("cam").onclick = () => {
  const err = native.takePhoto();
  if (err) { showBubble("呜…" + err, "SAD"); return; }
  setStatus("拍照中…");
};

window.Miku.onPhoto = (b64) => {
  pendingImage = b64;
  $("cam").classList.add("attach");
  setStatus("已就绪", "on");
  showBubble("拍好啦～发送时会一起给 Miku 看", "NORMAL");
};

$("connect").onclick = () => {
  const h = $("host").value.trim();
  if (!h) return;
  // 交给原生发起连接（页面自己不碰网络，避免 mixed-content 限制）
  native && native.connect && native.connect(h);
  $("setup").classList.add("hide");
  setStatus("连接中…");
};

// 未捕获错误都要能被 adb logcat 看到
window.addEventListener("error", (e) => reportFail(e.message));
window.addEventListener("unhandledrejection", (e) =>
  reportFail("Promise: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

try {
  console.log("页面脚本就绪");
  // 告诉原生「JS 起来了」——与「模型渲染成功」是两件事。
  // 原生收到后才会下发 loadModel()，所以这一步不能等到模型加载完再调。
  native && native.pageAlive && native.pageAlive();
} catch (e) { reportFail(e.message); }
</script>
</body>
</html>
