# 开发机内存紧张：总量 15.7 GB，跑模拟器时只剩几百 MB 可用，
# 提交量（commit limit）一度触顶，构建报
# 「Native memory allocation (malloc) failed」。
#
# 所以：Gradle 堆压到 1GB，并让 Kotlin 编译器在进程内跑（省一个 JVM）。
# 仍然不够时，构建前先把模拟器停掉（错峰，别同时跑）。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# 关键：Kotlin 编译在 Gradle 进程内完成，避免再起一个 JVM
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
